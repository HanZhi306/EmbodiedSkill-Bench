[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-skill-bench"
version = "0.1.0"
description = "EmbodiedSkillBench runtime for closed-loop physical-task evaluation"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "jsonschema>=4.24,<5", "requests>=2.31,<3", "PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/HanZhi306/EmbodiedSkill-Bench"
Documentation = "https://github.com/HanZhi306/EmbodiedSkill-Bench/blob/main/RUN_BENCH.md"
Issues = "https://github.com/HanZhi306/EmbodiedSkill-Bench/issues"

[project.scripts]
esbench = "embodied_skill_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
